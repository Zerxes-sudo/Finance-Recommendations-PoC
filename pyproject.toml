[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-recommendations-poc"
version = "0.1.0"
description = "Local, explainable Indian-market investment research proof of concept."
readme = "docs/intent/PROJECT_INTENT.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "streamlit>=1.45,<2",
    "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
